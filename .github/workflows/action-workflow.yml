name: Docker Build and Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.dockerhub_username }}/UAS-PCC-Nama_MHS-2025:latest .
          echo ${{ secrets.dockerhub_AccessToken }} | docker login -u ${{ secrets.dockerhub_username }} --password-stdin
          docker push ${{ secrets.dockerhub_username }}/UAS-PCC-Nama_MHS-2025:latest